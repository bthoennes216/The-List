<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The List</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    body {
      margin: 0;
      background: #f5f5f2;
      color: #222;
    }
    header {
      background: #315c43;
      color: white;
      padding: 28px 20px 24px;
    }
    header h1 {
      margin: 0;
      font-size: 32px;
    }
    header p {
      margin: 6px 0 0;
      opacity: 0.85;
    }
    main {
      padding: 18px;
      max-width: 700px;
      margin: auto;
    }
    h2 {
      margin-top: 10px;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .card {
      background: white;
      border-radius: 16px;
      padding: 18px;
      border: 1px solid #e3e3df;
      box-shadow: 0 2px 8px rgba(0,0,0,.05);
    }
    .category {
      min-height: 120px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .icon {
      font-size: 32px;
    }
    .category strong {
      font-size: 16px;
    }
    .add-button {
      width: 100%;
      margin-top: 18px;
      padding: 15px;
      border: none;
      border-radius: 14px;
      background: #315c43;
      color: white;
      font-size: 17px;
      font-weight: bold;
    }
    .welcome {
      margin-bottom: 18px;
    }
  </style>
</head>
<body>
<header>
  <h1>🏠 The List</h1>
  <p>Our home projects, plans & ideas</p>
</header>
<main>
  <div class="welcome">
    <h2>What are we working on?</h2>
    <p>Keep everything for our home in one place.</p>
  </div>
  <div class="grid">
    <div class="card category">
      <span class="icon">🏠</span>
      <strong>House</strong>
    </div>
    <div class="card category">
      <span class="icon">🌱</span>
      <strong>Lawn & Landscaping</strong>
    </div>
    <div class="card category">
      <span class="icon">🌿</span>
      <strong>Garden</strong>
    </div>
    <div class="card category">
      <span class="icon">🔨</span>
      <strong>DIY Projects</strong>
    </div>
    <div class="card category">
      <span class="icon">🚗</span>
      <strong>Vehicles</strong>
    </div>
    <div class="card category">
      <span class="icon">🛠️</span>
      <strong>Maintenance</strong>
    </div>
  </div>
  <button class="add-button">
    ＋ Add New Project
  </button>
</main>
</body>
</html>
